   "html": "<div class=\"about\"><h2>عَنْ <span class=\"m\">هَذَا</span> الْكِتَابِ — لِلْأَهْلِ</h2><p>نُورِي، النَّوْرَسُ الصَّغِيرُ، يُعَلِّمُ أَطْفَالَنَا: نَقُولُ «<span class=\"m\">هَذَا</span>» لِلْمُذَكَّرِ، وَ«<span class=\"f\">هَذِهِ</span>» لِلْمُؤَنَّثِ.</p><p>التَّاءُ الْمَرْبُوطَةُ <span class=\"ta\">ة</span> تُشْبِهُ صَدَفَةً صَغِيرَةً، وَهِيَ فِي الْغَالِبِ عَلَامَةُ الْمُؤَنَّثِ: قِطٌّ ← قِطَّةٌ.</p><p>وَبَعْضُ الْكَلِمَاتِ مُؤَنَّثَةٌ بِلَا <span class=\"ta\">ة</span>: بِنْتٌ، أُمٌّ، شَمْسٌ.</p><p>اقْرَؤُوا الْقِصَّةَ بِصَوْتٍ عَالٍ، ثُمَّ اكْتُبُوا مَعَ طِفْلِكُمْ فِي صَفَحَاتِ التَّمَارِينِ. امْسَحُوا الرَّمْزَ لِتَسْمَعُوا كُلَّ صَفْحَةٍ بِالْفُصْحَى أَوْ بِالْمِصْرِيِّ.</p>\n  <div class=\"en-block\" lang=\"en\"><h3>About this book — for parents</h3><p>Noori the seagull teaches one idea from the Nawras grade 1–2 lesson: we say <span class=\"m\">هَذَا</span> (this, masculine) and <span class=\"f\">هَذِهِ</span> (this, feminine).</p><p>The tā’ marbūṭa <span class=\"ta\">ة</span> looks like a little seashell. At the end of a word it usually marks the feminine: قِطّ (tomcat) becomes قِطَّة (she-cat).</p><p>The fence: some feminine words have no <span class=\"ta\">ة</span> — بِنْت (girl), أُمّ (mother), شَمْس (sun). They still take <span class=\"f\">هَذِهِ</span>. Children learn these by heart.</p><p>How to use it: read one story page a night aloud, pointing at the picture. Then do the exercise pages (from page 18) with a pencil: tracing starts at the green dot and runs right to left. Praise effort; never mark handwriting wrong.</p><p>Scan the code to hear every page read aloud in Fusha, or explained in Egyptian Arabic, and to write on an iPad.</p></div></div>",

   "title": "مُؤَنَّثٌ بِلَا ة",
   "tint": "#FFD86B",
   "audio": true,
   "html": "<div class=\"stage\"><img class=\"breathe\" src=\"../images-noori-shell/shams.webp\" alt=\"Noori said: “Right! Some words are feminine with no ة: this is a girl, this is a mother, this is the sun.”\"></div>\n  <div class=\"words\"><h2>مُؤَنَّثٌ بِلَا <span class=\"ta\">ة</span></h2><p class=\"line\">قَالَ نُورِي: صَحِيحٌ! بَعْضُ الْكَلِمَاتِ مُؤَنَّثَةٌ بِلَا <span class=\"ta\">ة</span>: <span class=\"f\">هَذِهِ</span> بِنْتٌ، <span class=\"f\">هَذِهِ</span> أُمٌّ، <span class=\"f\">هَذِهِ</span> شَمْسٌ.</p><p class=\"sound\">نَحْفَظُهَا فِي قُلُوبِنَا!</p><p class=\"en-line\" lang=\"en\">Noori said: “Right! Some words are feminine with no <span class=\"ta\">ة</span>: this is a girl, this is a mother, this is the sun.”</p><p class=\"eg-line\" lang=\"ar-EG\"><b>بِالْمِصْرِيِّ</b>نوري قال: صحّ! فيه كلمات مؤنَّثة من غير تاء مربوطة: هذهِ بِنتٌ، هذهِ أُمٌّ، هذهِ شَمسٌ.</p></div>",
   "note": "<span class=\"f\">هَذِهِ</span> الْكَلِمَاتُ الثَّلَاثُ نَحْفَظُهَا: بِنْتٌ، أُمٌّ، شَمْسٌ.<span class=\"en-line\" lang=\"en\">The fence: the <span class=\"ta\">ة</span> is a helper, not the rule. بِنْت، أُمّ، شَمْس take <span class=\"f\">هَذِهِ</span> with no <span class=\"ta\">ة</span>. Mother is in the words, not the picture.</span>"
  },

   "title": "وَالصِّفَةُ أَيْضًا!",
   "tint": "#9ED0F0",
   "audio": true,
   "html": "<div class=\"stage\"><img class=\"breathe\" src=\"../images-noori-shell/nashit.webp\" alt=\"This is an active boy (وَلَدٌ نَشِيطٌ), and this is an active girl (بِنْتٌ نَشِيطَةٌ).\"></div>\n  <div class=\"words\"><h2>وَالصِّفَةُ أَيْضًا!</h2><p class=\"line\"><span class=\"m\">هَذَا</span> وَلَدٌ نَشِيطٌ، وَ<span class=\"f\">هَذِهِ</span> بِنْتٌ نَشِيطَ‍<span class=\"ta\">‍ةٌ</span>.</p><p class=\"sound\">الصِّفَةُ تَأْخُذُ الصَّدَفَةَ أَيْضًا!</p><p class=\"en-line\" lang=\"en\">This is an active boy (وَلَدٌ نَشِيطٌ), and this is an active girl (بِنْتٌ نَشِيطَةٌ).</p><p class=\"eg-line\" lang=\"ar-EG\"><b>بِالْمِصْرِيِّ</b>هذا وَلَدٌ نَشيطٌ، وهذهِ بِنتٌ نَشيطةٌ. والصِّفة كمان بتاخد الصَّدَفة!</p></div>",
   "note": "بِنْتٌ بِلَا <span class=\"ta\">ة</span>، لَكِنَّ صِفَتَهَا تَأْخُذُ <span class=\"ta\">ة</span>: بِنْتٌ نَشِيطَةٌ.<span class=\"en-line\" lang=\"en\">Agreement: بِنْت has no ة, but the adjective after it does — نَشِيطَة. This is the champions’ challenge.</span>"

   "tint": "#F7A98B",
   "audio": true,
   "html": "<div class=\"stage\"><img class=\"breathe\" src=\"../images-noori-shell/bye.webp\" alt=\"We learned: هَذَا for masculine, هَذِهِ for feminine, and the little shell ة makes a word feminine.\"></div>\n  <div class=\"words\"><h2>أَحْسَنْتُمْ!</h2><p class=\"line\">تَعَلَّمْنَا: <span class=\"m\">هَذَا</span> لِلْمُذَكَّرِ، وَ<span class=\"f\">هَذِهِ</span> لِلْمُؤَنَّثِ، وَالصَّدَفَةُ الصَّغِيرَةُ <span class=\"ta\">ة</span> تَجْعَلُ الْكَلِمَةَ مُؤَنَّثَ‍<span class=\"ta\">‍ةً</span>.</p><p class=\"sound\">إِلَى اللِّقَاءِ يَا أَصْدِقَائِي!</p><p class=\"en-line\" lang=\"en\">We learned: <span class=\"m\">هَذَا</span> for masculine, <span class=\"f\">هَذِهِ</span> for feminine, and the little shell <span class=\"ta\">ة</span> makes a word feminine.</p><p class=\"eg-line\" lang=\"ar-EG\"><b>بِالْمِصْرِيِّ</b>اتعلّمنا: هذا للمُذَكَّر، وهذهِ للمُؤَنَّث، والصَّدَفة الصغيّرة بتخلّي الكلمة مؤنَّثة.</p></div>",
   "note": "الْآنَ إِلَى صَفَحَاتِ التَّمَارِينِ: قَلَمُ رَصَاصٍ، وَنَبْدَأُ مِنَ النُّقْطَةِ الْخَضْرَاءِ.<span class=\"en-line\" lang=\"en\">Now the exercise pages: a pencil, and every tracing starts at the green dot.</span>"

var AUDIO_DIR = { ar:'../audio/ar/', eg:'../audio/eg/' };

/* ============================================================
   Wiring (after bedtime-stories' story-template)
   ============================================================ */
var spread = document.getElementById('spread'), dots = document.getElementById('dots');
var prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
var player = document.getElementById('player');
var at = 0, voice = 'ar', autoplay = true, unlocked = false, big = false, autoturn = false, turnTimer = null;
var TURN_PAUSE = 5000;
var pages = BOOK.pages;

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function render(){
  var page = pages[at];
  spread.className = 'spread ' + page.type + (page.exercise ? ' exercise' : '');
  spread.style.setProperty('--tint', page.tint ? page.tint + '33' : 'transparent');
  var html = page.html;
  html += '<div class="listen"><button class="play" id="playBtn" type="button"' + (page.audio ? '' : ' disabled') + '>' +
    '<svg class="ico" viewBox="0 0 15 17" aria-hidden="true" style="transform:scaleX(-1)"><path d="M1 1 L14 8.5 L1 16 Z" fill="currentColor"/></svg>' +
    '<span id="playLabel">' + (page.audio ? 'اقْرَأْ لِي' : 'بِلَا صَوْتٍ') + '</span><span lang="en" style="font-weight:400;font-size:.85em;opacity:.8">' + (page.audio ? 'Read to me' : 'No narration') + '</span></button></div>';
  if (page.note) html += '<p class="note"><b>لِلْكِبَارِ<br><span lang="en">Grown-ups</span></b><span>' + page.note + '</span></p>';
  spread.innerHTML = html;
  wirePage(page);
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  prevBtn.disabled = at === 0;
  nextBtn.disabled = at === pages.length - 1;
  document.getElementById('nextLabel').textContent = at === 0 ? 'ابْدَأْ' : 'اقْلِبِ الصَّفْحَةَ';
  Array.prototype.forEach.call(dots.children, function (d, n) { d.classList.toggle('on', n === at); d.setAttribute('aria-current', n === at ? 'page' : 'false'); });
  try { history.replaceState(null, '', '#' + page.key); } catch (e) {}
  document.title = page.title + ' · ' + BOOK.title;
  loadAudio();
}

/* ---------- exercises: pads, picks, the certificate ---------- */
function wirePage(page){
  Array.prototype.forEach.call(spread.querySelectorAll('[data-writepad]'), function (el) {
    var model = el.getAttribute('data-model');
    KS.writePad(el, { model: model ? model.split('|') : [], lines: +el.getAttribute('data-lines') || 1, lineHeight: +el.getAttribute('data-line-height') || undefined });
  });
  Array.prototype.forEach.call(spread.querySelectorAll('[data-pic]'), function (el) {
    el.innerHTML = KS.pic(el.getAttribute('data-pic'), { decorative: true });
  });
  Array.prototype.forEach.call(spread.querySelectorAll('[data-gull]'), function (el) {
    el.innerHTML = KS.gull(el.getAttribute('data-gull'));
  });
  var picks = spread.querySelectorAll('.pick');
  var score = spread.querySelector('.score'), hint = spread.querySelector('.hint');
  var got = 0, total = spread.querySelectorAll('[data-group]').length;
  Array.prototype.forEach.call(picks, function (b) {
    b.addEventListener('click', function () {
      unlocked = true;
      var group = b.closest('[data-group]');
      if (b.getAttribute('data-ok') === '1') {
        b.classList.add('is-right');
        if (b.hasAttribute('data-fill')) {
          var slot = group.querySelector('.slot'); if (slot) slot.innerHTML = b.getAttribute('data-fill');
        }
        Array.prototype.forEach.call(group.querySelectorAll('.pick'), function (x) { x.disabled = true; });
        got++;
        if (score) score.innerHTML += KS.star(true);
        if (hint) { hint.textContent = got === total ? 'أَحْسَنْتَ! كُلُّ الْإِجَابَاتِ صَحِيحَةٌ — Well done!' : 'رَائِعٌ! — Great!'; hint.className = 'hint good'; }
        if (window.KS && KS.sfx) KS.sfx('good');
        if (got === total && KS.confetti) KS.confetti(24);
      } else {
        b.classList.remove('is-wrong'); void b.offsetWidth; b.classList.add('is-wrong');
        if (hint) { hint.textContent = group.getAttribute('data-hint') || page.hint || 'حَاوِلْ مَرَّةً أُخْرَى — try again'; hint.className = 'hint'; }
        if (window.KS && KS.sfx) KS.sfx('bad');
      }
    });
  });
  var nameIn = spread.querySelector('#champName');
  if (nameIn) {
    nameIn.value = store('noori-shell-name') || '';
    nameIn.addEventListener('input', function () { store('noori-shell-name', nameIn.value.trim()); });
  }
}

function buildDots(){
  dots.innerHTML = '';
  pages.forEach(function (p, n) {
    var d = document.createElement('button');
    d.type = 'button';
    if (p.exercise) d.className = 'ex';
    d.setAttribute('aria-label', 'صَفْحَةُ ' + (n + 1) + ' — ' + p.title);
    d.addEventListener('click', function () { show(n); });
    dots.appendChild(d);
  });
}

/* ---------- audio ---------- */
function loadAudio(){
  player.pause();
  var page = pages[at];
  if (page.audio) player.src = AUDIO_DIR[voice] + page.key + '.mp3';
  else player.removeAttribute('src');
  setPlayState(false);
}
function setPlayState(playing){
  var btn = document.getElementById('playBtn');
  if (!btn) return;
  btn.dataset.state = playing ? 'playing' : 'idle';
  if (pages[at].audio) document.getElementById('playLabel').textContent = playing ? 'إِيقَافٌ' : 'اقْرَأْ لِي';
}
function togglePlay(){
  unlocked = true;
  if (!pages[at].audio) return;
  if (player.paused) player.play().then(function () { setPlayState(true); }).catch(function () { setPlayState(false); });
  else { player.pause(); setPlayState(false); }
}

/* ---------- turning the pages by itself (waits after the narration; never on an exercise) ---------- */
function stopTurning(){ if (turnTimer) { clearTimeout(turnTimer); turnTimer = null; } }
function queueTurn(){
  stopTurning();
  if (!autoturn || at >= pages.length - 1 || pages[at].exercise) return;
  if (!player.paused && !player.ended) return;
  turnTimer = setTimeout(function () { if (autoturn && at < pages.length - 1) show(at + 1); }, TURN_PAUSE);
}
player.addEventListener('ended', function () { setPlayState(false); queueTurn(); });
player.addEventListener('pause', function () { setPlayState(false); stopTurning(); });

function show(i){
  stopTurning();
  at = Math.max(0, Math.min(pages.length - 1, i));
  render();
  if (autoplay && unlocked && pages[at].audio) {
    player.play().then(function () { setPlayState(true); }).catch(function () { queueTurn(); });
  } else queueTurn();
  document.querySelector('.book').scrollIntoView({ block: 'nearest' });
}

/* ---------- chrome ---------- */
nextBtn.addEventListener('click', function () { unlocked = true; show(at + 1); });
prevBtn.addEventListener('click', function () { show(at - 1); });
document.getElementById('startBtn').addEventListener('click', function () { show(0); });

var notesBtn = document.getElementById('notesBtn'), autoBtn = document.getElementById('autoBtn'), turnBtn = document.getElementById('turnBtn');
function paintChrome(){
  var off = document.body.classList.contains('notes-off');
  notesBtn.innerHTML = (off ? 'إِظْهَارُ مُلَاحَظَاتِ الْكِبَارِ' : 'إِخْفَاءُ مُلَاحَظَاتِ الْكِبَارِ') + ' <span lang="en">' + (off ? 'Show notes' : 'Hide notes') + '</span>';
  notesBtn.setAttribute('aria-pressed', String(!off));
  autoBtn.innerHTML = 'تَشْغِيلٌ تِلْقَائِيٌّ: ' + (autoplay ? 'نَعَمْ' : 'لَا') + ' <span lang="en">Auto-play ' + (autoplay ? 'on' : 'off') + '</span>';
  autoBtn.setAttribute('aria-pressed', String(autoplay));
  turnBtn.setAttribute('aria-pressed', String(autoturn));
  document.getElementById('fsBtn').setAttribute('aria-pressed', String(big));
}
notesBtn.addEventListener('click', function () { document.body.classList.toggle('notes-off'); paintChrome(); });
autoBtn.addEventListener('click', function () { autoplay = !autoplay; paintChrome(); });
turnBtn.addEventListener('click', function () { autoturn = !autoturn; paintChrome(); if (autoturn) queueTurn(); else stopTurning(); });
document.getElementById('enBtn').addEventListener('click', function () {
  var on = document.body.classList.toggle('show-en');
  this.setAttribute('aria-pressed', String(on));
  store('noori-shell-en', on ? '1' : '0');
});
document.getElementById('voices').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  voice = b.getAttribute('data-voice');
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  document.body.classList.toggle('show-eg', voice === 'eg');
  store('noori-shell-voice', voice);
  loadAudio();
});
document.getElementById('fsBtn').addEventListener('click', function () {
  big = !big;
  document.body.classList.toggle('big', big);
  if (big && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  else if (!big && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
  paintChrome();
});
document.addEventListener('fullscreenchange', function () {
  if (!document.fullscreenElement && big) { big = false; document.body.classList.remove('big'); paintChrome(); }
});
document.addEventListener('keydown', function (e) {
  if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') show(at + 1);     // right to left: forward is to the left
  if (e.key === 'ArrowRight') show(at - 1);
});
var x0 = null, book = document.querySelector('.book');
book.addEventListener('touchstart', function (e) { x0 = e.target.closest('.wp-stage') ? null : e.changedTouches[0].clientX; }, { passive: true });
book.addEventListener('touchend', function (e) {
  if (x0 === null) return;
  var dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 60) show(at + (dx > 0 ? 1 : -1));
  x0 = null;
}, { passive: true });

if (store('noori-shell-en') === '0') { document.body.classList.remove('show-en'); document.getElementById('enBtn').setAttribute('aria-pressed', 'false'); }
if (store('noori-shell-voice') === 'eg') document.querySelector('#voices [data-voice="eg"]').click();
var fromHash = location.hash.slice(1);
pages.forEach(function (p, n) { if (p.key === fromHash) at = n; });
window.addEventListener('hashchange', function () {
  var k = location.hash.slice(1);
  pages.forEach(function (p, n) { if (p.key === k && n !== at) show(n); });
});
buildDots();
paintChrome();
render();
</script>
</body>
</html>
